<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Ember Reliquary — a stealth heist</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0e14; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; font-family: Georgia, 'Times New Roman', serif; }
  #wrap { position: relative; }
  #game { display: block; width: min(96vw, 960px); height: auto; border: 2px solid #3a2f1d; border-radius: 6px; background: #141a26; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="960" height="640" aria-label="The Ember Reliquary: a top-down stealth heist. Move with WASD or arrow keys, avoid guard and camera vision cones, steal the Ember Heart gem and escape through the service door."></canvas>
  <p id="status" role="status" aria-live="polite"></p>
</div>
<script type="module" src="./js/main.js"></script>
</body>
</html>
